<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<defs><style>
.bg{fill:#f7f9fc}.title{font:700 30px Arial,sans-serif;fill:#172b4d}.sub{font:16px Arial,sans-serif;fill:#52627a}
.box{fill:#fff;stroke:#8aa0bd;stroke-width:2}.blue{fill:#eaf2ff;stroke:#3973c6}.green{fill:#e9f7ef;stroke:#32945f}.violet{fill:#f2edff;stroke:#8063c7}.orange{fill:#fff3e5;stroke:#d78a32}
.h{font:700 19px Arial,sans-serif;fill:#17345c}.t{font:15px Arial,sans-serif;fill:#34445c}.small{font:13px Arial,sans-serif;fill:#66758a}
.arrow{stroke:#536985;stroke-width:3;fill:none;marker-end:url(#arr)}
</style><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#536985"/></marker></defs>
<rect class="bg" width="1400" height="760"/>
<text class="title" x="700" y="54" text-anchor="middle">Архитектура синтетической демонстрации</text>
<text class="sub" x="700" y="84" text-anchor="middle">Два формата Excel-выписок • локальный запуск • независимый контроль результата</text>
<rect class="box blue" x="70" y="150" width="340" height="150" rx="16"/>
<text class="h" x="240" y="185" text-anchor="middle">generate_fixtures.py</text>
<text class="t" x="240" y="220" text-anchor="middle">Создание тестовых книг Excel</text><text class="t" x="240" y="247" text-anchor="middle">BANK1/source</text><text class="t" x="240" y="272" text-anchor="middle">BANK2/source</text>
<rect class="box green" x="530" y="130" width="340" height="175" rx="16"/>
<text class="h" x="700" y="166" text-anchor="middle">clean_bank1.py</text><text class="t" x="700" y="199" text-anchor="middle">Очистка формата BANK1</text><text class="t" x="700" y="226" text-anchor="middle">• удаление дебетовых строк</text><text class="t" x="700" y="251" text-anchor="middle">• удаление внутренних переводов</text><text class="t" x="700" y="276" text-anchor="middle">• сохранение допустимых объединений</text>
<rect class="box green" x="530" y="390" width="340" height="175" rx="16"/>
<text class="h" x="700" y="426" text-anchor="middle">clean_bank2.py</text><text class="t" x="700" y="459" text-anchor="middle">Очистка формата BANK2</text><text class="t" x="700" y="486" text-anchor="middle">• удаление дебетовых строк</text><text class="t" x="700" y="511" text-anchor="middle">• удаление внутренних переводов</text><text class="t" x="700" y="536" text-anchor="middle">• удаление блока от исходящего сальдо</text>
<rect class="box violet" x="990" y="150" width="340" height="150" rx="16"/>
<text class="h" x="1160" y="185" text-anchor="middle">Результаты обработки</text><text class="t" x="1160" y="220" text-anchor="middle">BANK1/output/*.xlsx</text><text class="t" x="1160" y="247" text-anchor="middle">BANK2/output/*.xlsx</text><text class="small" x="1160" y="274" text-anchor="middle">Исходные книги не перезаписываются</text>
<rect class="box orange" x="990" y="410" width="340" height="150" rx="16"/>
<text class="h" x="1160" y="445" text-anchor="middle">verify_demo.py</text><text class="t" x="1160" y="480" text-anchor="middle">Проверка правил очистки</text><text class="t" x="1160" y="507" text-anchor="middle">Проверка целостности XLSX</text><text class="small" x="1160" y="534" text-anchor="middle">Формирование JSON-отчётов</text>
<rect class="box" x="530" y="635" width="340" height="78" rx="16"/>
<text class="h" x="700" y="667" text-anchor="middle">qa_report.json + qa_summary.json</text><text class="small" x="700" y="692" text-anchor="middle">PASS / FAIL по каждому условию</text>
<path class="arrow" d="M410 225 H500 V217 H530"/><path class="arrow" d="M500 225 V477 H530"/>
<path class="arrow" d="M870 217 H930 V225 H990"/><path class="arrow" d="M870 477 H930 V260 H990"/>
