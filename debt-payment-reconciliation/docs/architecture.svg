<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500" role="img" aria-labelledby="title desc">
  <title id="title">Архитектура автоматизации задолженности и сверки банковских платежей</title>
  <desc id="desc">Платёжный план и банковские выписки подготавливаются и обрабатываются. Задолженность группируется и сопоставляется с платежами. Результаты записываются в три листа рабочей книги: data, total и send. Внизу показано создание резервной копии.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#52657a"/></marker>
    <style>
      .bg{fill:#f5f7fb}
      .title{font:700 48px Arial,sans-serif;fill:#172b4d}
      .subtitle{font:28px Arial,sans-serif;fill:#52657a}
      .box{fill:#fff;stroke:#9aabc0;stroke-width:3;rx:20}
      .blue{fill:#eaf2ff;stroke:#4c78bd}
      .green{fill:#e9f7ef;stroke:#41966a}
      .amber{fill:#fff4df;stroke:#c58b2b}
      .purple{fill:#f2edff;stroke:#8064b5}
      .head{font:700 32px Arial,sans-serif;fill:#172b4d}
      .body{font:25px Arial,sans-serif;fill:#34465c}
      .small{font:23px Arial,sans-serif;fill:#52657a}
      .arrow{fill:none;stroke:#52657a;stroke-width:4;marker-end:url(#arrow)}
      .line{fill:none;stroke:#52657a;stroke-width:4}
    </style>
  </defs>

  <rect class="bg" width="1800" height="1500"/>
  <text class="title" x="900" y="78" text-anchor="middle">Автоматизация задолженности и сверки платежей</text>
  <text class="subtitle" x="900" y="124" text-anchor="middle">Подготовка данных → обработка выписок → сопоставление → обновление рабочей книги</text>

  <!-- Источники -->
  <rect class="box blue" x="70" y="185" width="440" height="165"/>
  <text class="head" x="290" y="238" text-anchor="middle">Платёжный план Excel</text>
  <text class="body" x="290" y="288" text-anchor="middle">Исходные обязательства</text>
  <text class="small" x="290" y="322" text-anchor="middle">Данные по задолженности</text>

  <rect class="box blue" x="680" y="185" width="440" height="165"/>
  <text class="head" x="900" y="238" text-anchor="middle">Банковские выписки</text>
  <text class="body" x="900" y="288" text-anchor="middle">Банк 1 и Банк 2</text>
  <text class="small" x="900" y="322" text-anchor="middle">Входящие Excel-файлы</text>

  <rect class="box blue" x="1290" y="185" width="440" height="165"/>
  <text class="head" x="1510" y="238" text-anchor="middle">Рабочая книга Excel</text>
  <text class="body" x="1510" y="288" text-anchor="middle">Единый файл обработки</text>
  <text class="small" x="1510" y="322" text-anchor="middle">Результат работы скрипта</text>

  <!-- Подготовка и загрузка -->
  <rect class="box purple" x="70" y="435" width="440" height="180"/>
  <text class="head" x="290" y="490" text-anchor="middle">debt.py</text>
  <text class="body" x="290" y="540" text-anchor="middle">Подготовка данных</text>
  <text class="small" x="290" y="580" text-anchor="middle">Перенос и форматирование</text>

  <rect class="box green" x="680" y="435" width="440" height="180"/>
  <text class="head" x="900" y="490" text-anchor="middle">Загрузка и разбор выписок</text>
  <text class="body" x="900" y="540" text-anchor="middle">Определение полей</text>
  <text class="small" x="900" y="580" text-anchor="middle">Фильтрация банковских операций</text>

  <path class="arrow" d="M290 350 V435"/>
  <path class="arrow" d="M900 350 V435"/>
  <path class="arrow" d="M510 525 H590 V390 H1510 V350"/>
  <path class="arrow" d="M1120 525 H1200 V390 H1510 V350"/>

  <!-- Группировка и сопоставление -->
  <rect class="box purple" x="570" y="685" width="660" height="145"/>
  <text class="head" x="900" y="740" text-anchor="middle">Группировка задолженности</text>
  <text class="body" x="900" y="790" text-anchor="middle">Юрлицо · дата оплаты по плану · расчётный счёт</text>
  <path class="arrow" d="M900 615 V685"/>

  <rect class="box green" x="570" y="875" width="660" height="125"/>
  <text class="head" x="900" y="925" text-anchor="middle">Сопоставление с банковскими платежами</text>
  <text class="body" x="900" y="970" text-anchor="middle">Сумма · юрлицо · город в назначении платежа</text>
  <path class="arrow" d="M900 830 V875"/>

  <!-- Решение -->
  <path class="arrow" d="M900 1000 V1030"/>
  <polygon points="900,1030 1070,1110 900,1190 730,1110" fill="#fff4df" stroke="#c58b2b" stroke-width="3"/>
  <text class="head" x="900" y="1102" text-anchor="middle">Сколько найдено</text>
  <text class="small" x="900" y="1138" text-anchor="middle">совпадений?</text>

  <!-- Три листа результата в одной строке -->
  <rect class="box green" x="70" y="1160" width="440" height="150"/>
  <text class="head" x="290" y="1218" text-anchor="middle">Лист data</text>
  <text class="body" x="290" y="1268" text-anchor="middle">Задолженность для проверки</text>

  <rect class="box purple" x="680" y="1160" width="440" height="150"/>
  <text class="head" x="900" y="1218" text-anchor="middle">Лист total</text>
  <text class="body" x="900" y="1268" text-anchor="middle">Итоговая аналитика по городам</text>

  <rect class="box amber" x="1290" y="1160" width="440" height="150"/>
  <text class="head" x="1510" y="1218" text-anchor="middle">Лист send</text>
  <text class="body" x="1510" y="1268" text-anchor="middle">Однозначно найденные совпадения</text>

  <!-- Ветви решения: data — нет/несколько, send — ровно одно; total обновляется в рамках обработки -->
  <path class="arrow" d="M730 1110 H600 V1135 H290 V1160"/>
  <path class="arrow" d="M1070 1110 H1200 V1135 H1510 V1160"/>
  <path class="arrow" d="M900 1110 V1160"/>

  <!-- Три листа сходятся к резервному копированию -->
  <path class="line" d="M290 1310 V1350 M900 1310 V1350 M1510 1310 V1350"/>
  <path class="line" d="M290 1350 H1510"/>
  <path class="arrow" d="M900 1350 V1390"/>

  <rect class="box blue" x="400" y="1390" width="1000" height="90"/>
  <text class="head" x="900" y="1448" text-anchor="middle">Создание резервной копии рабочей книги XLSM</text>
</svg>