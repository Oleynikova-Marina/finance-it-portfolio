<svg xmlns="http://www.w3.org/2000/svg" width="3600" height="2200" viewBox="0 0 3600 2200" role="img" aria-labelledby="title desc">
<title id="title">Архитектура синтетической демонстрации</title>
<desc id="desc">Создание тестовых книг Excel, обработка двух банковских форматов, сохранение результатов и независимая проверка с JSON-отчётами.</desc>
<defs>
  <style>
    .bg{fill:#f7f9fc}
    .title{font:700 90px Arial,sans-serif;fill:#172b4d}
    .sub{font:48px Arial,sans-serif;fill:#52627a}
    .box{fill:#fff;stroke:#8aa0bd;stroke-width:6}
    .blue{fill:#eaf2ff;stroke:#3973c6}
    .green{fill:#e9f7ef;stroke:#32945f}
    .violet{fill:#f2edff;stroke:#8063c7}
    .orange{fill:#fff3e5;stroke:#d78a32}
    .h{font:700 57px Arial,sans-serif;fill:#17345c}
    .t{font:45px Arial,sans-serif;fill:#34445c}
    .small{font:39px Arial,sans-serif;fill:#66758a}
    .arrow{stroke:#536985;stroke-width:9;fill:none;marker-end:url(#arr)}
    .dash{stroke-dasharray:20 16}
  </style>
  <marker id="arr" markerWidth="22" markerHeight="22" refX="18" refY="7" orient="auto">
    <path d="M0,0 L0,14 L20,7 z" fill="#536985"/>
  </marker>
</defs>
<rect class="bg" width="3600" height="2200"/>
<text class="title" x="1800" y="145" text-anchor="middle">Архитектура синтетической демонстрации</text>
<text class="sub" x="1800" y="235" text-anchor="middle">Два формата Excel-выписок • локальный запуск • независимый контроль результата</text>

<!-- Генератор тестовых данных -->
<rect class="box blue" x="120" y="650" width="820" height="520" rx="36"/>
<text class="h" x="530" y="760" text-anchor="middle">generate_fixtures.py</text>
<text class="t" x="190" y="875">Создание тестовых книг Excel</text>
<text class="t" x="190" y="965">• BANK1/source</text>
<text class="t" x="190" y="1045">• BANK2/source</text>

<!-- Очистка формата 1 -->
<rect class="box green" x="1260" y="390" width="1080" height="570" rx="36"/>
<text class="h" x="1800" y="500" text-anchor="middle">clean_bank1.py</text>
<text class="t" x="1350" y="625">Очистка формата BANK1</text>
<text class="t" x="1350" y="720">• удаление дебетовых строк</text>
<text class="t" x="1350" y="805">• удаление внутренних переводов</text>
<text class="t" x="1350" y="890">• сохранение допустимых объединений</text>

<!-- Очистка формата 2 -->
<rect class="box green" x="1260" y="1120" width="1080" height="570" rx="36"/>
<text class="h" x="1800" y="1230" text-anchor="middle">clean_bank2.py</text>
<text class="t" x="1350" y="1355">Очистка формата BANK2</text>
<text class="t" x="1350" y="1450">• удаление дебетовых строк</text>
<text class="t" x="1350" y="1535">• удаление внутренних переводов</text>
<text class="t" x="1350" y="1620">• удаление блока от исходящего сальдо</text>

<!-- Результаты -->
<rect class="box violet" x="2660" y="650" width="820" height="520" rx="36"/>
<text class="h" x="3070" y="760" text-anchor="middle">Результаты обработки</text>
<text class="t" x="2730" y="875">BANK1/output/*.xlsx</text>
<text class="t" x="2730" y="965">BANK2/output/*.xlsx</text>
<text class="small" x="2730" y="1060">Исходные книги не перезаписываются</text>

<!-- Независимая проверка -->
<rect class="box orange" x="2660" y="1330" width="820" height="440" rx="36"/>
<text class="h" x="3070" y="1440" text-anchor="middle">verify_demo.py</text>
<text class="t" x="2730" y="1550">Проверка правил очистки</text>
<text class="t" x="2730" y="1630">Проверка целостности XLSX</text>
<text class="small" x="2730" y="1700">Формирование JSON-отчётов</text>

<!-- QA-отчёты -->
<rect class="box" x="1260" y="1880" width="1080" height="230" rx="36"/>
<text class="h" x="1800" y="1980" text-anchor="middle">qa_report.json + qa_summary.json</text>
<text class="small" x="1800" y="2055" text-anchor="middle">PASS / FAIL по каждому условию</text>

<!-- Потоки -->
<path class="arrow" d="M940 790 H1100 V675 H1260"/>
<path class="arrow" d="M1100 920 V1405 H1260"/>
<path class="arrow" d="M2340 675 H2500 V790 H2660"/>
<path class="arrow" d="M2340 1405 H2500 V1040 H2660"/>
<path class="arrow" d="M3070 1170 V1330"/>
<path class="arrow" d="M2660 1550 H2500 V1995 H2340"/>

<text class="small" x="1800" y="1810" text-anchor="middle">Проверяющий скрипт читает обработанные XLSX и формирует отчёты</text>
</svg>