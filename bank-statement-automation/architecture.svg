<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">Архитектура автоматизации банковских выписок</title>
  <desc id="desc">Два входных формата выписок обрабатываются единым запуском и отдельными алгоритмами. Результаты сохраняются в общей папке и прикладываются к черновику Outlook для ручной проверки.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#52657a"/></marker>
    <style>
      .bg{fill:#f5f7fb}.title{font:700 48px Arial,sans-serif;fill:#172b4d}.subtitle{font:28px Arial,sans-serif;fill:#52657a}
      .box{fill:#fff;stroke:#9aabc0;stroke-width:3;rx:20}.blue{fill:#eaf2ff;stroke:#4c78bd}.green{fill:#e9f7ef;stroke:#41966a}.amber{fill:#fff4df;stroke:#c58b2b}.purple{fill:#f2edff;stroke:#8064b5}
      .head{font:700 34px Arial,sans-serif;fill:#172b4d}.body{font:26px Arial,sans-serif;fill:#34465c}.small{font:24px Arial,sans-serif;fill:#52657a}
      .arrow{fill:none;stroke:#52657a;stroke-width:4;marker-end:url(#arrow)}.dash{fill:none;stroke:#8b9aad;stroke-width:3;stroke-dasharray:10 9}
    </style>
  </defs>
  <rect class="bg" width="1800" height="1100"/>
  <text class="title" x="900" y="78" text-anchor="middle">Автоматизация банковских выписок</text>
  <text class="subtitle" x="900" y="124" text-anchor="middle">Два формата → единый запуск → обработка → общий результат → черновик Outlook</text>

  <rect class="box blue" x="70" y="205" width="360" height="170"/>
  <text class="head" x="250" y="255" text-anchor="middle">Входные файлы</text>
  <text class="body" x="250" y="305" text-anchor="middle">Папка «Банк 1»</text>
  <text class="small" x="250" y="342" text-anchor="middle">Excel-выписки (.xlsx)</text>

  <rect class="box blue" x="70" y="425" width="360" height="170"/>
  <text class="head" x="250" y="475" text-anchor="middle">Входные файлы</text>
  <text class="body" x="250" y="525" text-anchor="middle">Папка «Банк 2»</text>
  <text class="small" x="250" y="562" text-anchor="middle">Excel-выписки (.xlsx)</text>

  <rect class="box purple" x="535" y="295" width="330" height="220"/>
  <text class="head" x="700" y="350" text-anchor="middle">main.py</text>
  <text class="body" x="700" y="400" text-anchor="middle">Единый запуск</text>
  <text class="small" x="700" y="445" text-anchor="middle">Последовательно запускает</text>
  <text class="small" x="700" y="478" text-anchor="middle">оба обработчика</text>

  <rect class="box green" x="990" y="205" width="340" height="170"/>
  <text class="head" x="1160" y="255" text-anchor="middle">bank_1_cleaner.py</text>
  <text class="body" x="1160" y="305" text-anchor="middle">Правила для формата</text>
  <text class="body" x="1160" y="340" text-anchor="middle">Банка 1</text>

  <rect class="box green" x="990" y="425" width="340" height="170"/>
  <text class="head" x="1160" y="475" text-anchor="middle">bank_2_cleaner.py</text>
  <text class="body" x="1160" y="525" text-anchor="middle">Правила для формата</text>
  <text class="body" x="1160" y="560" text-anchor="middle">Банка 2</text>

  <rect class="box amber" x="1430" y="295" width="300" height="220"/>
  <text class="head" x="1580" y="350" text-anchor="middle">Папка</text>
  <text class="head" x="1580" y="392" text-anchor="middle">результатов</text>
  <text class="body" x="1580" y="445" text-anchor="middle">Обработанные</text>
  <text class="body" x="1580" y="480" text-anchor="middle">Excel-файлы</text>

  <path class="arrow" d="M430 290 H485 V365 H535"/>
  <path class="arrow" d="M430 510 H485 V445 H535"/>
  <path class="arrow" d="M865 365 H925 V290 H990"/>
  <path class="arrow" d="M865 445 H925 V510 H990"/>
  <path class="arrow" d="M1330 290 H1380 V365 H1430"/>
  <path class="arrow" d="M1330 510 H1380 V445 H1430"/>

  <rect class="box purple" x="535" y="700" width="330" height="170"/>
  <text class="head" x="700" y="755" text-anchor="middle">config.py</text>
  <text class="body" x="700" y="805" text-anchor="middle">Локальные настройки</text>
  <text class="small" x="700" y="842" text-anchor="middle">Пути, адреса, подпись</text>
  <path class="dash" d="M700 700 V550"/>
  <text class="small" x="720" y="635">параметры запуска</text>

  <rect class="box amber" x="990" y="700" width="340" height="170"/>
  <text class="head" x="1160" y="755" text-anchor="middle">outlook_draft.py</text>
  <text class="body" x="1160" y="805" text-anchor="middle">Собирает файлы</text>
  <text class="body" x="1160" y="840" text-anchor="middle">и создаёт черновик</text>
  <path class="arrow" d="M1580 515 V620 H1160 V700"/>

  <rect class="box green" x="1430" y="700" width="300" height="170"/>
  <text class="head" x="1580" y="755" text-anchor="middle">Outlook</text>
  <text class="body" x="1580" y="805" text-anchor="middle">Черновик письма</text>
  <text class="small" x="1580" y="842" text-anchor="middle">с Excel-вложениями</text>
  <path class="arrow" d="M1330 785 H1430"/>

  <rect x="535" y="930" width="1195" height="105" rx="18" fill="#eef1f5" stroke="#aab5c2" stroke-width="2"/>
  <text class="head" x="565" y="975">Ручная проверка</text>
  <text class="body" x="565" y="1015">Черновик сохраняется в Outlook и не отправляется автоматически.</text>
</svg>